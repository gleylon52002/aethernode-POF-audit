<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowSmall" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Orbit Rings -->
  <g stroke="#7C3AED" stroke-width="1.5" fill="none" opacity="0.3">
    <ellipse cx="200" cy="200" rx="160" ry="60" transform="rotate(30 200 200)" />
    <ellipse cx="200" cy="200" rx="160" ry="60" transform="rotate(-30 200 200)" />
    <ellipse cx="200" cy="200" rx="160" ry="60" transform="rotate(90 200 200)" />
  </g>

  <!-- Floating Nodes -->
  <g fill="#3B82F6" filter="url(#glowSmall)">
    <circle cx="80" cy="140" r="4" />
    <circle cx="320" cy="260" r="6" />
    <circle cx="200" cy="40" r="5" />
    <circle cx="200" cy="360" r="5" />
    <circle cx="60" cy="260" r="4" />
    <circle cx="340" cy="140" r="5" />
  </g>
  
  <!-- Shield with Glow -->
  <g filter="url(#glow)">
    <path d="M200 100 L120 130 V190 C120 260 155 315 200 340 C245 315 280 260 280 190 V130 L200 100 Z" fill="url(#heroGrad)" opacity="0.9" />
  </g>
  
  <!-- Inner Shield Highlight -->
  <path d="M200 115 L135 140 V190 C135 245 162 290 200 310 C238 290 265 245 265 190 V140 L200 115 Z" fill="none" stroke="#EDEDF2" stroke-width="2" opacity="0.5" />
  
  <!-- Checkmark -->
  <path d="M170 210 L190 230 L230 180" fill="none" stroke="#EDEDF2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
